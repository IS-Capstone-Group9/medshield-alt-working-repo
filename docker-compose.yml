services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: 5000
      USE_SUPABASE: ${USE_SUPABASE:-false}
      SESSION_SECRET: ${SESSION_SECRET:-local-docker-session-secret-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      DATABRICKS_HOST: ${DATABRICKS_HOST:-}
      DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:-}
      DATABRICKS_INGESTION_ENABLED: ${DATABRICKS_INGESTION_ENABLED:-false}
      DATABRICKS_INGESTION_CLIENT_EXPORTS: ${DATABRICKS_INGESTION_CLIENT_EXPORTS:-false}
      DATABRICKS_INGESTION_TOKEN: ${DATABRICKS_INGESTION_TOKEN:-}
      DATABRICKS_INGESTION_VOLUME: ${DATABRICKS_INGESTION_VOLUME:-}
      DATABRICKS_INGESTION_JOB_ID: ${DATABRICKS_INGESTION_JOB_ID:-}
      DATABRICKS_ITEMIZED_SOURCE: ${DATABRICKS_ITEMIZED_SOURCE:-gold}
      DATABRICKS_WAREHOUSE_RELEASE_ID: ${DATABRICKS_WAREHOUSE_RELEASE_ID:-}
      DATABRICKS_SQL_WAREHOUSE_ID: ${DATABRICKS_SQL_WAREHOUSE_ID:-}
      DATABRICKS_CATALOG: ${DATABRICKS_CATALOG:-workspace}
      DATABRICKS_SCHEMA: ${DATABRICKS_SCHEMA:-medshield_gold}
      DATABRICKS_DESCRIPTIVE_ADAPTER: ${DATABRICKS_DESCRIPTIVE_ADAPTER:-}
      DATABRICKS_QUERY_CONCURRENCY: ${DATABRICKS_QUERY_CONCURRENCY:-3}
      DATABRICKS_DESCRIPTIVE_FACT_VERSION: ${DATABRICKS_DESCRIPTIVE_FACT_VERSION:?Set the validated descriptive fact version}
      DATABRICKS_DESCRIPTIVE_SCHEMA: ${DATABRICKS_DESCRIPTIVE_SCHEMA:-medshield_gold}
      DATABRICKS_DESCRIPTIVE_DATASET_ID: ${DATABRICKS_DESCRIPTIVE_DATASET_ID:-}
      DATABRICKS_DESCRIPTIVE_POLICY_VERSION: ${DATABRICKS_DESCRIPTIVE_POLICY_VERSION:-}
      DATABRICKS_RESEARCH_FACT_VERSION: ${DATABRICKS_RESEARCH_FACT_VERSION:-}
      DATABRICKS_FINANCIAL_RELEASE_ID: ${DATABRICKS_FINANCIAL_RELEASE_ID:-}
      DATABRICKS_FINANCIAL_MANIFEST_SHA256: ${DATABRICKS_FINANCIAL_MANIFEST_SHA256:-}
      DATABRICKS_EXTENSION_RESEARCH_SHA256: ${DATABRICKS_EXTENSION_RESEARCH_SHA256:-}
      DATABRICKS_SO1_SHA256: ${DATABRICKS_SO1_SHA256:-}
      DATABRICKS_TRUTH_RELEASE_ID: ${DATABRICKS_TRUTH_RELEASE_ID:-}
      DATABRICKS_TRUTH_MANIFEST_SHA256: ${DATABRICKS_TRUTH_MANIFEST_SHA256:-}
      DATABRICKS_TRUTH_STL_SHA256: ${DATABRICKS_TRUTH_STL_SHA256:-}
    ports:
      - "5000:5000"
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5000}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
