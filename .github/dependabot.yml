# Dependabot configuration for MedShield Decision Support System
version: 2
updates:
  # Maintain Node.js dependencies for backend
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Maintain Node.js dependencies for frontend
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Maintain Python dependencies for analytics service
  - package-ecosystem: "pip"
    directory: "/services/analytics_service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Maintain Python dependencies for product service
  - package-ecosystem: "pip"
    directory: "/services/product_service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
