name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Basic CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install (if package.json present)
        run: |
          if [ -f package.json ]; then npm ci; else echo "no package.json, skipping"; fi
      - name: Run tests (placeholder)
        run: |
          if [ -f package.json ] && grep -q "test" package.json; then npm test; else echo "no tests configured"; fi
      - name: Lint check (placeholder)
        run: echo "Add lint commands to the workflow as needed"
