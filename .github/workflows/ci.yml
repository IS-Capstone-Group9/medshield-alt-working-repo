name: CI Pipeline

on:
  pull_request:
  push:
    branches: ['**']
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Run gateway regression tests
        run: node --import tsx --test tests/*.test.ts

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5000
      NEXT_PUBLIC_SUPABASE_URL: ''
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ''
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm exec --yes --package=npm@11.21.1 -- npm ci
      - run: npm run lint
      - name: Build and typecheck Next.js
        run: npm run build

  python:
    name: Python offline regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      USE_SUPABASE: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            .github/requirements-ci.txt
            services/analytics_service/requirements.txt
            services/product_service/requirements.txt
      - name: Install offline test dependencies
        run: python -m pip install -r .github/requirements-ci.txt
      - run: python -m pip check
      - name: Test Python services
        run: python -m unittest discover -s services/tests -v
      - name: Test Databricks transformations offline
        run: python -m unittest discover -s databricks/medshield_project/tests -v
      - name: Test descriptive STL
        run: python -m unittest services.analytics_service.jobs.test_descriptive_stl -v

  docker:
    name: Docker build validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend, python]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate Compose without printing environment values
        run: docker compose --env-file .env.example config --quiet
      - name: Build gateway image
        run: docker build -t medshield-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t medshield-frontend:ci ./frontend

  required:
    name: CI required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [backend, frontend, python, docker]
    steps:
      - name: Require every baseline check to pass
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        shell: bash
        run: |
          for result in "$BACKEND_RESULT" "$FRONTEND_RESULT" "$PYTHON_RESULT" "$DOCKER_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "A required job failed, was cancelled, or was skipped."
              exit 1
            fi
          done
          echo "All required CI checks passed."
