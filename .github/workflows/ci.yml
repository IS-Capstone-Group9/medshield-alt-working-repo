name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend TypeScript Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build gateway
        run: npm run build

  frontend:
    name: Frontend Next.js Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5000
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""
        run: npm run build

  python:
    name: Python Services & Model Master Execution Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('services/analytics_service/requirements.txt', 'services/product_service/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/analytics_service/requirements.txt -r services/product_service/requirements.txt

      - name: Run Python unit tests
        run: python -m unittest discover services/tests

      - name: Run master 17-model computation suite
        run: python scripts/compute_all_models.py

      - name: Upload model snapshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: medshield-model-snapshot
          if-no-files-found: error
          path: data/medshield/processed/dashboard_sales_snapshot.json

  docker:
    name: Docker Container & Compose Validation
    runs-on: ubuntu-latest
    needs: [backend, frontend, python]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build backend image
        run: docker build -t medshield-backend:test ./backend

      - name: Build frontend image
        run: docker build -t medshield-frontend:test ./frontend

      - name: Build services image
        run: docker build -t medshield-services:test -f services/Dockerfile .
