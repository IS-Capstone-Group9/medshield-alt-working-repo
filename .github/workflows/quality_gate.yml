name: MedShield DSS Quality Gate

on:
  push:
    branches: [ main, fix_ui, dev ]
  pull_request:
    branches: [ main ]

jobs:
  quality-audit:
    name: Code Quality & Diagnostic Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/analytics_service/requirements.txt
          pip install -r backend/requirements.txt

      - name: Run Python Unit Test Suite
        run: |
          python -m unittest discover -s services/tests

      - name: Run System Diagnostics
        run: |
          python scripts/system_health_check.py

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Type-Check (Frontend)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Install Backend Gateway Dependencies
        working-directory: backend
        run: npm ci

      - name: TypeScript Type-Check (Backend Gateway)
        working-directory: backend
        run: npx tsc --noEmit
